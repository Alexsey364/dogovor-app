{% extends "base.html" %}
{% block crumb %}Создать договор{% endblock %}
{% block body %}
<div class="card">
  <div class="card-h"><h2>Новый договор</h2><span class="pill">№ {{ next_num }}</span></div>
  <form method="post" class="form" id="cform">
    <label>Наша компания
      <select name="owner_company_id" required>
        <option value="">— выберите —</option>
        {% for oc in companies %}<option value="{{ oc.id }}">{{ oc.short_name }}</option>{% endfor %}
      </select>
      <span class="hint">От кого заключаем договор.</span>
    </label>
    <label>Тип работ (шаблон)
      <select name="type_code" id="type_code" required>
        <option value="">— выберите —</option>
        {% for t in types %}
        <option value="{{ t.code }}" data-adv="{{ t.default_advance_pct or '' }}" data-war="{{ t.warranty_months or '' }}">{{ t.name }}</option>
        {% endfor %}
      </select>
      <span class="hint">Шаблон подставит типовой аванс и гарантию — их можно поправить.</span>
    </label>

    <label>Заказчик из списка
      <select name="counterparty_id" id="cp_id">
        <option value="">— или впишите нового справа —</option>
        {% for c in cps %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
      </select>
    </label>
    <label>Новый заказчик<input name="counterparty_new" placeholder="ООО «…»"></label>
    <label>Тип заказчика
      <select name="cp_kind">
        <option value="commercial">коммерческий</option>
        <option value="budget">бюджет</option>
        <option value="uk_tsj">УК / ТСЖ</option>
        <option value="government">госконтракт</option>
        <option value="individual">физлицо / ИП</option>
      </select>
    </label>

    <label class="wide">Объект (адрес)<input name="address" placeholder="г. Уссурийск, ул. …"></label>
    <label class="wide">Предмет договора<input name="subject" required placeholder="Монтаж узла учёта тепловой энергии"></label>

    <label>Дата подписания<input name="signed_on" type="date"></label>
    <label>Сумма, ₽<input name="amount" type="number" step="0.01" inputmode="decimal"></label>
    <label>Аванс, %<input name="advance_pct" id="adv" type="number" step="1" min="0" max="100"></label>
    <label>Гарантия, мес.<input name="warranty_months" id="war" type="number" step="1" min="0"></label>
    <label class="check"><input type="checkbox" name="has_penalty" checked> Есть неустойка за просрочку оплаты</label>

    <div class="form-foot">
      <button class="btn" type="submit">Создать и проверить</button>
      <a class="btn-ghost" href="{{ url_for('registry') }}">Отмена</a>
      <span class="muted">Договор создаётся как черновик и сразу проходит проверку</span>
    </div>
  </form>
</div>
<script>
  var sel = document.getElementById('type_code');
  sel.addEventListener('change', function(){
    var o = sel.options[sel.selectedIndex];
    if (o.dataset.adv) document.getElementById('adv').value = o.dataset.adv;
    if (o.dataset.war) document.getElementById('war').value = o.dataset.war;
  });
</script>
{% endblock %}

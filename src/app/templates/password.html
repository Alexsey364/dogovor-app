{% extends "base.html" %}
{% block crumb %}Смена пароля{% endblock %}
{% block body %}
<div class="card" style="max-width:460px">
  <div class="card-h"><h2>Смена пароля</h2></div>
  <div style="padding:16px">
    {% if forced %}<div class="note" style="margin-bottom:14px">Вы вошли с временным паролем. Задайте свой, чтобы продолжить.</div>{% endif %}
    <form method="post" class="stack">
      {% if not forced %}
      <label>Текущий пароль<input type="password" name="old" autocomplete="current-password" required></label>
      {% endif %}
      <label>Новый пароль<input type="password" name="new" autocomplete="new-password" minlength="8" required></label>
      <label>Повторите новый<input type="password" name="new2" autocomplete="new-password" minlength="8" required></label>
      <button class="btn" type="submit">Сохранить</button>
    </form>
  </div>
</div>
{% endblock %}
